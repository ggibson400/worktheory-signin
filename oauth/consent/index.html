<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Work Theory sign-in</title>
<style>
  :root {
    --ink: #1d1f21; --muted: #5d6166; --line: #d9dcdf; --ground: #f6f5f2; --card: #ffffff;
    --accent: #1f4f46; --accent-ink: #ffffff; --error: #9b2c1f;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #eceae6; --muted: #a3a6a9; --line: #3a3d40; --ground: #161718; --card: #202224;
      --accent: #7fc4b4; --accent-ink: #10201c; --error: #f0907f;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 24px 16px; background: var(--ground); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  main { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px; }
  .mark { font-weight: 600; letter-spacing: .02em; font-size: 14px; color: var(--muted); margin: 0 0 20px; }
  .env { color: var(--error); }
  h1 { font-size: 21px; line-height: 1.3; margin: 0 0 8px; }
  p { margin: 0 0 16px; color: var(--muted); }
  label { display: block; font-size: 14px; font-weight: 600; margin: 0 0 6px; }
  input { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--ground); color: var(--ink); margin: 0 0 16px; }
  input:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  button { font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  button.secondary { background: transparent; color: var(--ink); border-color: var(--line); }
  button:disabled { opacity: .6; cursor: wait; }
  .error { color: var(--error); font-size: 14px; min-height: 1.5em; margin: 0 0 12px; }
  .who { font-size: 14px; }
  .who button, .link { padding: 0; border: 0; background: none; color: var(--accent); font-weight: 400; text-decoration: underline; }
  .link { font-size: 14px; margin-top: 16px; }
</style>
</head>
<body>
<main>
  <p class="mark">Work Theory<span class="env"></span></p>

  <section id="signin" hidden>
    <h1>Sign in to Work Theory</h1>
    <p id="signin-lede">We'll email you a code to sign in with.</p>
    <form id="signin-form">
      <label for="email">Your email address</label>
      <input id="email" type="email" autocomplete="email" required>
      <div id="code-field" hidden>
        <label for="code">The code from the email</label>
        <input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="10">
      </div>
      <div id="passcode-field" hidden>
        <label for="passcode">Passcode</label>
        <input id="passcode" type="password" autocomplete="current-password">
      </div>
      <p class="error" id="signin-error" role="alert"></p>
      <button type="submit" id="signin-submit">Email me a code</button>
    </form>
    <!-- The passcodes stay until everyone has signed in by email once (docs/specs/2026-10-24-web-portal.md, Part 1). -->
    <button type="button" class="link" id="use-passcode">Sign in with a passcode instead</button>
  </section>

  <section id="consent" hidden>
    <h1>Allow <span id="client-name">Claude</span> to use the knowledge base?</h1>
    <p>It will read and save client memories and shared lessons as you.</p>
    <p class="who">Signed in as <strong id="user-email"></strong>. <button type="button" id="switch">Not you?</button></p>
    <p class="error" id="consent-error" role="alert"></p>
    <div class="actions">
      <button type="button" id="approve">Allow</button>
      <button type="button" class="secondary" id="deny">Cancel</button>
    </div>
  </section>

  <section id="message" hidden>
    <h1 id="message-title"></h1>
    <p id="message-text"></p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = 'https://vykvpabpeumddbrgoxnb.supabase.co'
  const PUBLISHABLE_KEY = 'sb_publishable_sL-q02PMrY0WNqs7rxw2gw_-y2Mwhwc'
  // Whether this project sends sign-in codes yet (scripts/publish-signin.mjs).
  const EMAIL_CODES = 'true' === 'true'
  const db = supabase.createClient(SUPABASE_URL, PUBLISHABLE_KEY)
  const authorizationId = new URLSearchParams(location.search).get('authorization_id')
  const $ = (id) => document.getElementById(id)

  function show(id) {
    for (const s of ['signin', 'consent', 'message']) $(s).hidden = s !== id
  }

  function message(title, text) {
    $('message-title').textContent = title
    $('message-text').textContent = text
    show('message')
  }

  async function consent() {
    const { data, error } = await db.auth.oauth.getAuthorizationDetails(authorizationId)
    if (error) {
      if (error.status === 401 || error.status === 403) {
        await db.auth.signOut()
        return show('signin')
      }
      return message('This sign-in link has expired', 'Go back to Claude and connect again.')
    }
    if (data.redirect_url) return location.assign(data.redirect_url)
    $('client-name').textContent = data.client?.name || 'Claude'
    $('user-email').textContent = data.user?.email || ''
    show('consent')
  }

  // How the form signs in: 'email' (send a code), 'code' (type it), or 'passcode'.
  const firstMode = EMAIL_CODES ? 'email' : 'passcode'
  let mode = firstMode
  function setMode(next) {
    mode = next
    $('code-field').hidden = mode !== 'code'
    $('passcode-field').hidden = mode !== 'passcode'
    $('code').required = mode === 'code'
    $('passcode').required = mode === 'passcode'
    $('email').readOnly = mode === 'code'
    $('signin-submit').textContent = mode === 'email' ? 'Email me a code' : 'Sign in'
    $('signin-lede').textContent = mode === 'code'
      ? `We emailed a code to ${$('email').value.trim()}. It can take a minute to arrive.`
      : mode === 'passcode' ? 'Sign in with your email address and passcode.' : "We'll email you a code to sign in with."
    $('use-passcode').textContent = mode === 'email' ? 'Sign in with a passcode instead' : mode === 'code' ? 'Use a different email address' : 'Sign in with an email code instead'
    $('signin-error').textContent = ''
  }
  $('use-passcode').addEventListener('click', () => setMode(mode === 'email' ? 'passcode' : 'email'))
  $('use-passcode').hidden = !EMAIL_CODES
  setMode(firstMode)

  async function signInWithPasscode() {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/staff-sign-in`, {
      method: 'POST',
      headers: { apikey: PUBLISHABLE_KEY, 'content-type': 'application/json', 'x-region': 'us-west-1' },
      body: JSON.stringify({ email: $('email').value, passcode: $('passcode').value }),
    })
    const body = await res.json().catch(() => ({}))
    if (!res.ok) throw new Error(body.error || 'Sign-in failed. Try again.')
    const { error } = await db.auth.setSession({ access_token: body.access_token, refresh_token: body.refresh_token })
    if (error) throw error
    $('passcode').value = ''
  }

  $('signin-form').addEventListener('submit', async (event) => {
    event.preventDefault()
    const button = event.submitter
    button.disabled = true
    $('signin-error').textContent = ''
    try {
      const email = $('email').value.trim().toLowerCase()
      if (mode === 'email') {
        // Makes the account first: Auth's own sign-up is off (supabase/functions/start-sign-in).
        const started = await fetch(`${SUPABASE_URL}/functions/v1/start-sign-in`, {
          method: 'POST',
          // Run in the database's region: from elsewhere, each of its database calls crosses the country.
          headers: { apikey: PUBLISHABLE_KEY, 'content-type': 'application/json', 'x-region': 'us-west-1' },
          body: JSON.stringify({ email }),
        })
        if (!started.ok) throw new Error((await started.json().catch(() => ({}))).error || 'Something went wrong. Try again.')
        const { error } = await db.auth.signInWithOtp({ email, options: { shouldCreateUser: false } })
        if (error) throw new Error(error.status === 429 ? 'Too many codes asked for. Wait a few minutes and try again.' : error.message)
        setMode('code')
        $('code').focus()
        return
      }
      if (mode === 'code') {
        const { error } = await db.auth.verifyOtp({ email, token: $('code').value.trim(), type: 'email' })
        if (error) throw new Error(error.status === 429
          ? 'Too many tries from here. Wait a few minutes and try again.'
          : 'That code is not right, or it has expired. Check the latest email, or ask for a new code.')
        $('code').value = ''
      } else {
        await signInWithPasscode()
      }
      await consent()
    } catch (error) {
      $('signin-error').textContent = error.message
    } finally {
      button.disabled = false
    }
  })

  for (const [id, decide] of [['approve', 'approveAuthorization'], ['deny', 'denyAuthorization']]) {
    $(id).addEventListener('click', async () => {
      $('approve').disabled = $('deny').disabled = true
      const { error } = await db.auth.oauth[decide](authorizationId)
      if (error) {
        $('consent-error').textContent = error.message
        $('approve').disabled = $('deny').disabled = false
      }
    })
  }

  $('switch').addEventListener('click', async () => {
    await db.auth.signOut()
    setMode(firstMode)
    show('signin')
  })

  ;(async () => {
    if (!authorizationId) {
      return message('Nothing to sign in to here', 'Add the Work Theory connector in Claude, and Claude will bring you to this page.')
    }
    const { data } = await db.auth.getSession()
    if (data.session) await consent()
    else show('signin')
  })()
</script>
</body>
</html>
